<!DOCTYPE html>
<html lang="en">
 <head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <meta content="noindex" name="robots"/>
  <title>
   404 · Level not found · Noah Hathout
  </title>
  <link href="/assets/images/PixelMe_50x50.jpg" rel="icon"/>
  <script>
   try {
     if (localStorage.getItem('darkmode') === 'active') document.documentElement.classList.add('darkmode');
   } catch (error) {}
  </script>
  <style>
   :root {
     color-scheme: light;
     --bg: #edf2f7;
     --card: rgba(255, 255, 255, 0.86);
     --ink: #0f172a;
     --ink-soft: #334155;
     --ink-muted: #64748b;
     --accent: #00796b;
     --accent-strong: #053b36;
     --border: rgba(15, 23, 42, 0.1);
   }
   html.darkmode {
     color-scheme: dark;
     --bg: #071120;
     --card: rgba(12, 22, 40, 0.86);
     --ink: #e5eefb;
     --ink-soft: #c4d2e5;
     --ink-muted: #8ea1bb;
     --accent: #38bdf8;
     --accent-strong: #8cf5e6;
     --border: rgba(148, 163, 184, 0.18);
   }
   * {
     box-sizing: border-box;
     margin: 0;
   }
   body {
     min-height: 100vh;
     display: grid;
     place-items: center;
     padding: 1.5rem;
     font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
     color: var(--ink-soft);
     background:
       radial-gradient(circle at 15% 10%, rgba(0, 121, 107, 0.14), transparent 30%),
       radial-gradient(circle at 85% 90%, rgba(250, 193, 35, 0.14), transparent 30%),
       var(--bg);
   }
   main {
     width: min(560px, 100%);
     padding: clamp(1.75rem, 5vw, 2.75rem);
     border-radius: 1.75rem;
     border: 1px solid var(--border);
     background: var(--card);
     box-shadow: 0 30px 70px rgba(15, 23, 42, 0.16);
     text-align: center;
   }
   .sprite {
     width: 112px;
     height: 112px;
     border-radius: 1.4rem;
     image-rendering: pixelated;
     box-shadow: 0 18px 36px rgba(15, 23, 42, 0.22);
     animation: bob 2.4s ease-in-out infinite;
   }
   @keyframes bob {
     0%, 100% { transform: translateY(0); }
     50% { transform: translateY(-8px); }
   }
   .code {
     margin-top: 1.5rem;
     font-size: clamp(3.5rem, 14vw, 5.5rem);
     font-weight: 900;
     line-height: 1;
     letter-spacing: 0.08em;
     color: var(--ink);
     text-shadow: 4px 4px 0 rgba(0, 121, 107, 0.25);
   }
   .kicker {
     margin-top: 0.75rem;
     font-size: 0.75rem;
     font-weight: 700;
     letter-spacing: 0.32em;
     text-transform: uppercase;
     color: var(--accent);
   }
   p.copy {
     margin-top: 1.1rem;
     line-height: 1.7;
   }
   .path {
     display: inline-block;
     max-width: 100%;
     margin-top: 0.4rem;
     padding: 0.2rem 0.55rem;
     border-radius: 0.45rem;
     border: 1px dashed var(--border);
     color: var(--ink-muted);
     overflow-wrap: anywhere;
   }
   .actions {
     margin-top: 1.75rem;
     display: flex;
     flex-wrap: wrap;
     justify-content: center;
     gap: 0.75rem;
   }
   .actions a {
     padding: 0.8rem 1.2rem;
     border-radius: 0.9rem;
     border: 2px solid var(--accent-strong);
     font-weight: 800;
     font-size: 0.8rem;
     letter-spacing: 0.12em;
     text-transform: uppercase;
     text-decoration: none;
     color: var(--ink);
     transition: transform 180ms ease, background 180ms ease, color 180ms ease;
   }
   .actions a:first-child {
     background: var(--accent-strong);
     color: var(--bg);
   }
   .actions a:hover,
   .actions a:focus-visible {
     transform: translateY(-3px);
   }
   .actions a:focus-visible {
     outline: 2px solid var(--accent);
     outline-offset: 3px;
   }
   @media (prefers-reduced-motion: reduce) {
     .sprite {
       animation: none;
     }
   }
  </style>
 </head>
 <body>
  <main>
   <img alt="Pixel-art portrait of Noah" class="sprite" height="112" src="/assets/opt/PixelMe.webp" width="112"/>
   <p class="code">
    404
   </p>
   <p class="kicker">
    Level not found
   </p>
   <p class="copy">
    This page wandered off the map. Nothing lives at
    <br/>
    <span class="path" id="missingPath">
     this address
    </span>
   </p>
   <div class="actions">
    <a href="/">
     Back to start
    </a>
    <a href="/#projects">
     See projects
    </a>
   </div>
  </main>
  <script>
   document.getElementById('missingPath').textContent = window.location.pathname || '/';
  </script>
 </body>
</html>
