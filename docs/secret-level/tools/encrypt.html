<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>memories.enc maker</title>
<style>
  body { font-family: ui-monospace, monospace; max-width: 760px; margin: 40px auto; padding: 0 16px; background: #171225; color: #fffdf4; }
  textarea { width: 100%; height: 320px; background: #0f0c1a; color: #cfe8cf; border: 2px solid #444; padding: 10px; font-family: inherit; font-size: 12px; }
  input { background: #0f0c1a; color: #fffdf4; border: 2px solid #444; padding: 8px; font-family: inherit; width: 240px; }
  button { background: #e8c74a; border: none; padding: 10px 18px; font-family: inherit; font-weight: bold; cursor: pointer; margin-top: 10px; }
  .row { margin: 12px 0; }
  #msg { margin-top: 12px; white-space: pre-wrap; }
  .ok { color: #8fe89a; } .err { color: #e8697f; }
</style>
</head>
<body>
  <h2>memories.enc maker 🔐</h2>
  <p>Paste your filled-in <code>memories.json</code> below, choose the password, hit encrypt.
     Save the downloaded file as <code>data/memories.enc</code> (replacing the old one).
     No network involved — everything happens in this tab.</p>
  <div class="row"><textarea id="json" placeholder='{"meta": { … }}'></textarea></div>
  <div class="row">password: <input id="pw" type="text" /></div>
  <div class="row">hint (optional, shown after 3 wrong tries): <input id="hint" type="text" /></div>
  <button id="go">encrypt ⇒ download memories.enc</button>
  <div id="msg"></div>
<script>
const ITER = 150000;
const b64 = (buf) => btoa(String.fromCharCode(...new Uint8Array(buf)));
document.getElementById("go").onclick = async () => {
  const msg = document.getElementById("msg");
  msg.className = "";
  try {
    const text = document.getElementById("json").value;
    JSON.parse(text); // validate
    const pw = document.getElementById("pw").value;
    if (!pw) throw new Error("password required");
    const hint = document.getElementById("hint").value.trim();
    const salt = crypto.getRandomValues(new Uint8Array(16));
    const iv = crypto.getRandomValues(new Uint8Array(12));
    const raw = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]);
    const key = await crypto.subtle.deriveKey({ name: "PBKDF2", salt, iterations: ITER, hash: "SHA-256" },
      raw, { name: "AES-GCM", length: 256 }, false, ["encrypt"]);
    const ct = await crypto.subtle.encrypt({ name: "AES-GCM", iv }, key, new TextEncoder().encode(text));
    const out = JSON.stringify({ v: 1, iter: ITER, salt: b64(salt), iv: b64(iv), ct: b64(ct), ...(hint ? { hint } : {}) });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([out], { type: "application/json" }));
    a.download = "memories.enc";
    a.click();
    msg.className = "ok";
    msg.textContent = "✓ encrypted + downloaded. move it to secret-level/data/memories.enc";
  } catch (e) {
    msg.className = "err";
    msg.textContent = "✗ " + e.message + (e instanceof SyntaxError ? "\n(your JSON has a syntax error — check trailing commas/quotes)" : "");
  }
};
</script>
</body>
</html>
